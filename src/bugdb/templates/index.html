<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugDB - Palo Alto Networks Bug Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pan-orange': '#FA582D',
                        'pan-dark': '#1A1A1A',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-pan-dark text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold">
                        <span class="text-pan-orange">Bug</span>DB
                    </h1>
                    <p class="text-gray-400 text-sm">Palo Alto Networks Bug Database</p>
                </div>
                <div class="text-right text-sm text-gray-400">
                    <p>Generated: <span id="generated-date">-</span></p>
                    <p>Version: <span id="schema-version">-</span></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Search and Filters -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <!-- Search Input -->
                <div class="lg:col-span-2">
                    <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Search</label>
                    <input
                        type="text"
                        id="search"
                        placeholder="Search bugs by ID, description..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pan-orange focus:border-transparent"
                    >
                </div>

                <!-- Product Filter -->
                <div>
                    <label for="product-filter" class="block text-sm font-medium text-gray-700 mb-1">Product</label>
                    <select
                        id="product-filter"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pan-orange focus:border-transparent"
                    >
                        <option value="">All Products</option>
                    </select>
                </div>

                <!-- Version Filter -->
                <div>
                    <label for="version-filter" class="block text-sm font-medium text-gray-700 mb-1">Version</label>
                    <select
                        id="version-filter"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pan-orange focus:border-transparent"
                    >
                        <option value="">All Versions</option>
                    </select>
                </div>

                <!-- Issue Type Filter -->
                <div>
                    <label for="type-filter" class="block text-sm font-medium text-gray-700 mb-1">Issue Type</label>
                    <select
                        id="type-filter"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pan-orange focus:border-transparent"
                    >
                        <option value="">All Types</option>
                        <option value="known">Known Issues</option>
                        <option value="addressed">Addressed Issues</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Results Count -->
        <div class="mb-4 flex items-center justify-between">
            <p class="text-gray-600">
                Showing <span id="results-count" class="font-semibold">0</span> issues
            </p>
            <button id="clear-filters" class="text-pan-orange hover:underline text-sm">
                Clear all filters
            </button>
        </div>

        <!-- Results Container -->
        <div id="results" class="space-y-4">
            <!-- Issue cards will be rendered here -->
        </div>

        <!-- No Results Message -->
        <div id="no-results" class="hidden text-center py-12">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h3 class="mt-2 text-sm font-medium text-gray-900">No issues found</h3>
            <p class="mt-1 text-sm text-gray-500">Try adjusting your search or filters.</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pan-orange mx-auto"></div>
            <p class="mt-4 text-gray-600">Loading bug database...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-pan-dark text-gray-400 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>BugDB - A static bug database viewer</p>
            <p class="mt-1">Data sourced from Palo Alto Networks Release Notes</p>
        </div>
    </footer>

    <script src="assets/app.js"></script>
</body>
</html>
