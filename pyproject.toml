[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugdb"
version = "1.0.0"
description = "Static HTML website generator for browsing Palo Alto Networks bug/issue data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx[http2]>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
bugdb = "bugdb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bugdb"]

[tool.hatch.build.targets.wheel.force-include]
"src/bugdb/templates/assets" = "bugdb/templates/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
