[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugdb"
dynamic = ["version"]
description = "Static HTML website generator for browsing Palo Alto Networks bug/issue data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bugdb = "bugdb.cli:app"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/bugdb"]

[tool.hatch.build.targets.wheel.force-include]
"src/bugdb/templates/assets" = "bugdb/templates/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Default run excludes heavy integration tiers. Opt in explicitly, e.g.
#   pytest -m data_baseline tests/integration/
#   pytest -m canary tests/canary/
addopts = "--strict-markers -m 'not data_baseline and not canary'"
markers = [
    "data_baseline: compares assets/data.json against the committed baseline snapshot. Heavy; runs in the separate GitLab 'integration' pipeline.",
    "canary: probes real docs.paloaltonetworks.com URLs to catch upstream version releases. Nightly pipeline only.",
    "slow: marks tests as slow (reserved for future use).",
]
