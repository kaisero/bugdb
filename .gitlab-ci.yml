image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

stages:
  - test
  - integration
  - deploy

# ---------------------------------------------------------------------------
# Lint: ruff check + format-check. Uses only the `dev` dependency group
# (no Playwright install) so it runs in seconds. Runs on every develop
# commit AND on every merge request — style must be green before merge.
# ---------------------------------------------------------------------------
lint:
  stage: test
  script:
    - uv sync --locked --group dev
    - uv run ruff check --output-format=gitlab . > ruff-report.json || (uv run ruff check . && exit 1)
    - uv run ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json
    paths:
      - ruff-report.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Fast tier: unit + mock-crawler tests. Runs on every commit to develop.
# ---------------------------------------------------------------------------
test:
  stage: test
  script:
    - uv sync --locked --group test
    - uv run playwright install --with-deps chromium
    - uv run pytest --junitxml=report.xml -v
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# Heavy tier: data-fidelity integration tests against the committed
# baseline. This job is deliberately isolated from the fast `test` stage:
#   - loads 13 MB data.json once per session
#   - parametrizes ~1900 assertions per (product, version) pair
#   - signal "did the fetch lose data" must not be drowned by parser churn
#
# Does NOT run on every commit. Triggered by:
#   - scheduled pipelines (nightly)
#   - manual button on any branch
#   - MRs that actually touch fetched data or the baseline
# ---------------------------------------------------------------------------
data-baseline-integration:
  stage: integration
  script:
    - uv sync --locked --group test
    - uv run pytest tests/integration/
        -m data_baseline
        --junitxml=integration.xml
        -v
  artifacts:
    when: always
    reports:
      junit: integration.xml
    paths:
      - integration.xml
    expire_in: 30 days
  timeout: 10 minutes
  rules:
    # Scheduled nightly runs always execute.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Explicit manual runs from the GitLab UI.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    # MRs that touch data, the baseline, or the integration tests.
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - assets/data.json
        - tests/baselines/**/*
        - tests/integration/**/*
        - src/bugdb/baseline.py

# ---------------------------------------------------------------------------
# Canary: probes real docs.paloaltonetworks.com URLs to detect when Palo
# Alto ships a new major version that the crawler's hard-coded candidate
# list doesn't know about. This is the only tier that catches the
# PAN-OS 12.1 class of bug.
#
# Scheduled nightly only — we don't want MRs blocked on upstream network
# availability.
# ---------------------------------------------------------------------------
upstream-canary:
  stage: integration
  script:
    - uv sync --locked --group test
    - uv run pytest tests/canary/
        -m canary
        --junitxml=canary.xml
        -v
  artifacts:
    when: always
    reports:
      junit: canary.xml
    expire_in: 30 days
  timeout: 5 minutes
  allow_failure: true  # Network flakes shouldn't page oncall at 3am.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------------------------------------------------------------------------
# Deploy: static site to GitLab Pages. Unchanged from before.
# ---------------------------------------------------------------------------
pages:
  stage: deploy
  script:
    - uv sync --locked
    - uv run bugdb generate-sample
    - uv run bugdb build-site-cmd -o public
    # Replace local data.json path with external URL
    - sed -i "s|fetch('assets/data.json')|fetch('https://repo.dependencyhell.net/bugdb/data.json')|g" public/assets/app.js
    # Remove local data.json since we're using external
    - rm -f public/assets/data.json
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
