image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  # bookworm-slim ships without ``curl``; jobs that talk to the
  # GitLab Package Registry install it via ``apt-get install curl``
  # before use. Pinned with --no-install-recommends so we don't pull
  # the full recommended set on every run.
  DEBIAN_FRONTEND: noninteractive

# Hidden template that holds the curl-install steps. Referenced by
# `data-baseline-integration`, `update-bugdb`, and `pages` — all of
# which talk to ``${CI_API_V4_URL}/.../packages/generic/bugdb/...``.
#
# We use GitLab's ``!reference`` tag rather than a YAML anchor here
# because a plain ``- *anchor`` reference to a list produces a
# *nested* list inside `script`, and the runner only runs the first
# element of that nested list — so ``apt-get update`` would fire and
# ``apt-get install`` would silently be skipped (or vice versa).
# ``!reference [.install_curl, script]`` is the GitLab-specific
# directive that flattens the steps in place.
.install_curl:
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

# Stage order: `fetch` deliberately precedes `integration`. On scheduled
# pipelines update-bugdb refreshes the Package Registry artifact FIRST and
# data-baseline-integration then validates the data that was just fetched.
# The old order (integration before fetch) had two problems:
#   - the baseline tests validated the PREVIOUS cycle's data, and
#   - a failing baseline run skipped the fetch stage entirely, freezing
#     the registry artifact until the baseline was fixed.
stages:
  - lint
  - test
  - fetch
  - integration
  - canary
  - deploy

# ---------------------------------------------------------------------------
# Lint: ruff check + format-check. In its own stage ahead of `test` so
# lint-only changes get feedback in seconds without waiting on test setup.
# Uses only the `dev` dependency group (no Playwright install).
# Runs on every develop commit AND on every merge request.
# ---------------------------------------------------------------------------
lint:
  stage: lint
  script:
    - uv sync --locked --group dev
    - uv run ruff check --output-format=gitlab . > ruff-report.json || (uv run ruff check . && exit 1)
    - uv run ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json
    paths:
      - ruff-report.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Fast tier: unit + crawler tests. Runs on every commit to develop and
# on every merge request.
#
# The `playwright install --with-deps chromium` step is required even
# though most crawler tests use the MockPlaywright fixture from
# tests/conftest.py. The root cause: several tests (TestCortexXDRCrawler,
# TestADEMCrawler, TestSCMCrawler, TestCloudNGFW*, TestDeviceSecurityCrawler,
# TestPluginVersionDiscovery) patch individual fetch methods but enter
# the crawler via `async with CortexXDRCrawler()`, which triggers
# BaseCrawler.__aenter__ → async_playwright().start() → chromium.launch().
# Until __aenter__ is made lazy or those tests are refactored to patch
# `async_playwright` at module level, a real Chromium must be installed.
# Tracked as roadmap item D3 (mock fixture coverage expansion).
# ---------------------------------------------------------------------------
test:
  stage: test
  script:
    - uv sync --locked --group test
    - uv run playwright install --with-deps chromium
    - uv run pytest --junitxml=report.xml -v
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Heavy tier: data-fidelity integration tests against the committed
# baseline. Deliberately isolated from the fast `test` stage:
#   - loads 13 MB bugdb.json once per session
#   - parametrizes ~1900 assertions per (product, version) pair
#   - signal "did the fetch lose data" must not be drowned by parser churn
#
# Runs AFTER the `fetch` stage: on scheduled pipelines it downloads the
# registry artifact that update-bugdb just uploaded, so the assertions
# apply to the freshest crawl. A red run here flags a data regression
# but never blocks the next fetch (see the stage-order comment above).
#
# Does NOT run on every commit. Triggered by:
#   - scheduled pipelines (nightly)
#   - manual button on any branch
#   - MRs that actually touch fetched data or the baseline
# ---------------------------------------------------------------------------
data-baseline-integration:
  stage: integration
  script:
    - !reference [.install_curl, script]
    - uv sync --locked --group test
    # Download bugdb.json from the Package Registry — the file is not
    # committed to the repo (13 MB). The update-bugdb scheduled job
    # keeps it current; if it hasn't run yet this job skips cleanly.
    - mkdir -p assets
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json" \
        -o assets/bugdb.json \
      || { echo "bugdb.json not in Package Registry — skipping integration tests"; exit 0; }
    - uv run pytest tests/integration/
        -m data_baseline
        --junitxml=integration.xml
        -v
  artifacts:
    when: always
    reports:
      junit: integration.xml
    paths:
      - integration.xml
    expire_in: 30 days
  timeout: 10 minutes
  rules:
    # Scheduled nightly runs always execute.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Explicit manual runs from the GitLab UI.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    # MRs that touch the committed data or baseline snapshot. Test
    # code and baseline.py changes are validated by the nightly
    # schedule — triggering on those in MRs would fail because
    # assets/bugdb.json (13 MB) is not committed to the repo.
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - assets/bugdb.json
        - tests/baselines/**/*

# ---------------------------------------------------------------------------
# Canary: probes real docs.paloaltonetworks.com URLs to detect when Palo
# Alto ships a new major version that the crawler's hard-coded candidate
# list doesn't know about. This is the only tier that catches the
# PAN-OS 12.1 class of bug.
#
# Lives in its OWN stage (not alongside data-baseline-integration) so a
# flaky upstream network probe can't block a green data-baseline run from
# deploying. Different failure modes deserve different blast radii.
#
# Scheduled nightly only — we don't want MRs blocked on upstream network
# availability.
# ---------------------------------------------------------------------------
upstream-canary:
  stage: canary
  # Empty `needs` detaches the canary from the fetch/integration DAG: it
  # probes upstream URLs directly and must keep running even when the
  # fetch or the baseline tier is red — different failure modes deserve
  # different blast radii.
  needs: []
  script:
    - uv sync --locked --group test
    - uv run pytest tests/canary/
        -m canary
        --junitxml=canary.xml
        -v
  artifacts:
    when: always
    reports:
      junit: canary.xml
    expire_in: 30 days
  timeout: 5 minutes
  allow_failure: true  # Network flakes shouldn't page oncall at 3am.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------------------------------------------------------------------------
# Fetch: incremental crawl of all products, uploading the result to
# GitLab's Generic Packages registry. Runs on a schedule (every 3 days,
# configured in the GitLab UI) and can be triggered manually.
#
# The first run will do a full fetch (no existing bugdb.json in the
# registry → curl 404 → starts from scratch). Subsequent runs download
# the previous bugdb.json and pass --incremental so only new versions
# are crawled.
#
# CI minutes budget: ~5-10 min incremental, ~15-20 min full.
# At every-3-days that's ~70 min/month — fits in the free tier's 400.
# ---------------------------------------------------------------------------
update-bugdb:
  stage: fetch
  script:
    - !reference [.install_curl, script]
    - uv sync --locked
    - uv run playwright install --with-deps chromium
    # Download existing bugdb.json from Package Registry (if any).
    # First run will 404 — that's fine, fetch starts from scratch.
    - mkdir -p assets
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json" \
        -o assets/bugdb.json \
      || echo "No existing bugdb.json in registry — starting fresh"
    # Incremental fetch: only crawl versions not already present.
    # Falls back to full fetch when assets/bugdb.json doesn't exist.
    - >-
      uv run bugdb fetch
      -o assets/bugdb.json
      --incremental
      --no-progress
      -l assets/bugdb.log
    # Upload the updated bugdb.json to the Generic Packages registry.
    # "latest" as the version keeps a single mutable artifact — no
    # version sprawl, and the Pages deploy always reads "latest".
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file assets/bugdb.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json"
  artifacts:
    when: always
    paths:
      - assets/bugdb.log
    expire_in: 7 days
  timeout: 90 minutes
  rules:
    # Scheduled pipeline (every 3 days via GitLab schedule UI).
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Manual trigger from the GitLab UI on any branch.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------------------------------------------------------------------------
# Deploy: static site to GitLab Pages.
#
# Downloads bugdb.json from the Generic Packages registry (populated by
# the update-bugdb scheduled job), builds the site with real data baked
# in, and deploys to Pages. No external CDN dependency — the frontend
# loads assets/bugdb.json from the same origin via a relative path.
#
# Fires on two occasions:
#
#   - a commit landing on `main` via a push pipeline, which in practice
#     means "after a merge request has been merged into main" (GitLab
#     runs a push-source pipeline on the resulting merge commit). This
#     ships site/template changes immediately. Explicitly branch-gated
#     to "main" rather than $CI_DEFAULT_BRANCH so the behaviour doesn't
#     silently change if the repo's default branch is ever switched.
#
#   - a scheduled pipeline, so the site actually picks up the bugdb.json
#     that update-bugdb uploaded earlier in the same run. Without this
#     the fetch keeps refreshing the registry while Pages serves whatever
#     was baked at the last merge — the site froze on the 2026-06-11 build
#     for six weeks that way.
#
# No `needs:` here on purpose. Sitting in the `deploy` stage means the
# stage order (fetch -> integration -> canary -> deploy) gates the deploy
# behind data-baseline-integration: a data regression skips the deploy and
# Pages keeps serving the last known-good build. upstream-canary is
# allow_failure, so an upstream network flake can't block a publish.
# ---------------------------------------------------------------------------
pages:
  stage: deploy
  script:
    - !reference [.install_curl, script]
    - uv sync --locked
    # Download bugdb.json from the Package Registry. If the scheduled
    # fetch hasn't run yet the curl will fail and the deploy aborts
    # with a clear message — run update-bugdb manually first.
    - mkdir -p assets
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json" \
        -o assets/bugdb.json \
      || { echo "ERROR: bugdb.json not found in Package Registry. Run the update-bugdb job first."; exit 1; }
    # Generate release-notes.json next to bugdb.json so build-site-cmd
    # auto-discovers it (see SiteBuilder.build_site in site_builder.py).
    - uv run bugdb generate-release-notes -o assets/release-notes.json --force
    - uv run bugdb build-site-cmd -b assets/bugdb.json -o public
  artifacts:
    paths:
      - public
  rules:
    # Merge landed on main — rebuild so site changes ship right away.
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    # Scheduled run — publish the data update-bugdb just fetched.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Manual button, for forcing a redeploy between schedules.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual