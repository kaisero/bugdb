image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

test:
  stage: test
  script:
    - uv sync --locked --group test
    - uv run playwright install --with-deps chromium
    - uv run pytest --junitxml=report.xml -v
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

pages:
  stage: deploy
  script:
    - uv sync --locked
    - uv run bugdb generate-sample
    - uv run bugdb build-site-cmd -o public
    # Replace local data.json path with external URL
    - sed -i "s|fetch('assets/data.json')|fetch('https://repo.dependencyhell.net/bugdb/data.json')|g" public/assets/app.js
    # Remove local data.json since we're using external
    - rm -f public/assets/data.json
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
