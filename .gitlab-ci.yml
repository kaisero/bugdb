variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  # Chromium resolves its shared libraries against the micromamba `pw`
  # env (built once in ~ — see project setup notes). /usr/lib64 and
  # /lib64 stay on the path so host-only libs like libudev resolve too.
  LD_LIBRARY_PATH: "$HOME/micromamba/envs/pw/lib:/usr/lib64:/lib64"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

stages:
  - lint
  - test
  - integration
  - canary
  - fetch
  - deploy

# ---------------------------------------------------------------------------
# Lint: ruff check + format-check. In its own stage ahead of `test` so
# lint-only changes get feedback in seconds. Uses only the `dev`
# dependency group (no Playwright install). No browser → LD_LIBRARY_PATH
# is harmless here.
# ---------------------------------------------------------------------------
lint:
  stage: lint
  script:
    - uv sync --locked --group dev
    - uv run ruff check --output-format=gitlab . > ruff-report.json || (uv run ruff check . && exit 1)
    - uv run ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json
    paths:
      - ruff-report.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Fast tier: unit + crawler tests. The browser binary is already in
# ~/.cache/ms-playwright (installed once during host setup), so we do NOT
# run `playwright install` here — the shell runner persists the cache
# between jobs, unlike the old Docker image. LD_LIBRARY_PATH (set in
# variables) lets the cached Chromium find its libs.
# ---------------------------------------------------------------------------
test:
  stage: test
  script:
    - uv sync --locked --group test
    - uv run pytest --junitxml=report.xml -v
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Heavy tier: data-fidelity integration tests against the committed
# baseline. No browser launch — pure data assertions — so the lib path
# is irrelevant here, but harmless.
# ---------------------------------------------------------------------------
data-baseline-integration:
  stage: integration
  script:
    - uv sync --locked --group test
    # Download bugdb.json from the Package Registry — the file is not
    # committed to the repo (13 MB). The update-bugdb scheduled job
    # keeps it current; if it hasn't run yet this job skips cleanly.
    - mkdir -p assets
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json" \
        -o assets/bugdb.json \
      || { echo "bugdb.json not in Package Registry — skipping integration tests"; exit 0; }
    - uv run pytest tests/integration/
        -m data_baseline
        --junitxml=integration.xml
        -v
  artifacts:
    when: always
    reports:
      junit: integration.xml
    paths:
      - integration.xml
    expire_in: 30 days
  timeout: 10 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - assets/bugdb.json
        - tests/baselines/**/*

# ---------------------------------------------------------------------------
# Canary: probes real docs.paloaltonetworks.com URLs to detect a new
# major version the crawler's candidate list doesn't know about.
# Scheduled nightly only. allow_failure so upstream network flakes don't
# page oncall.
# ---------------------------------------------------------------------------
upstream-canary:
  stage: canary
  script:
    - uv sync --locked --group test
    - uv run pytest tests/canary/
        -m canary
        --junitxml=canary.xml
        -v
  artifacts:
    when: always
    reports:
      junit: canary.xml
    expire_in: 30 days
  timeout: 5 minutes
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------------------------------------------------------------------------
# Fetch: incremental crawl of all products, uploading the result to
# GitLab's Generic Packages registry. This job DOES launch Chromium, so
# LD_LIBRARY_PATH matters. Browser binary already cached in ~ from setup.
# Schedule: every 3 days (GitLab UI). Can also be triggered manually.
# ---------------------------------------------------------------------------
update-bugdb:
  stage: fetch
  script:
    - uv sync --locked
    # Download existing bugdb.json from Package Registry (if any).
    # First run will 404 — that's fine, fetch starts from scratch.
    - mkdir -p assets
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json" \
        -o assets/bugdb.json \
      || echo "No existing bugdb.json in registry — starting fresh"
    # Incremental fetch: only crawl versions not already present.
    - >-
      uv run bugdb fetch
      -o assets/bugdb.json
      --incremental
      --no-progress
      -l assets/bugdb.log
    # Upload the updated bugdb.json to the Generic Packages registry.
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file assets/bugdb.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json"
  artifacts:
    when: always
    paths:
      - assets/bugdb.log
    expire_in: 7 days
  timeout: 30 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------------------------------------------------------------------------
# Deploy: static site to GitLab Pages. No browser launch — just reads
# bugdb.json and builds the site. Fires only on a push to main (i.e.
# after an MR merge).
# ---------------------------------------------------------------------------
pages:
  stage: deploy
  script:
    - uv sync --locked
    - mkdir -p assets
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bugdb/latest/bugdb.json" \
        -o assets/bugdb.json \
      || { echo "ERROR: bugdb.json not found in Package Registry. Run the update-bugdb job first."; exit 1; }
    - uv run bugdb generate-release-notes -o assets/release-notes.json --force
    - uv run bugdb build-site-cmd -b assets/bugdb.json -o public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"