image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

stages:
  - lint
  - test
  - integration
  - canary
  - deploy

# ---------------------------------------------------------------------------
# Lint: ruff check + format-check. In its own stage ahead of `test` so
# lint-only changes get feedback in seconds without waiting on test setup.
# Uses only the `dev` dependency group (no Playwright install).
# Runs on every develop commit AND on every merge request.
# ---------------------------------------------------------------------------
lint:
  stage: lint
  script:
    - uv sync --locked --group dev
    - uv run ruff check --output-format=gitlab . > ruff-report.json || (uv run ruff check . && exit 1)
    - uv run ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json
    paths:
      - ruff-report.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Fast tier: unit + crawler tests. Runs on every commit to develop and
# on every merge request.
#
# The `playwright install --with-deps chromium` step is required even
# though most crawler tests use the MockPlaywright fixture from
# tests/conftest.py. The root cause: several tests (TestCortexXDRCrawler,
# TestADEMCrawler, TestSCMCrawler, TestCloudNGFW*, TestDeviceSecurityCrawler,
# TestPluginVersionDiscovery) patch individual fetch methods but enter
# the crawler via `async with CortexXDRCrawler()`, which triggers
# BaseCrawler.__aenter__ → async_playwright().start() → chromium.launch().
# Until __aenter__ is made lazy or those tests are refactored to patch
# `async_playwright` at module level, a real Chromium must be installed.
# Tracked as roadmap item D3 (mock fixture coverage expansion).
# ---------------------------------------------------------------------------
test:
  stage: test
  script:
    - uv sync --locked --group test
    - uv run playwright install --with-deps chromium
    - uv run pytest --junitxml=report.xml -v
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_IID

# ---------------------------------------------------------------------------
# Heavy tier: data-fidelity integration tests against the committed
# baseline. Deliberately isolated from the fast `test` stage:
#   - loads 13 MB bugdb.json once per session
#   - parametrizes ~1900 assertions per (product, version) pair
#   - signal "did the fetch lose data" must not be drowned by parser churn
#
# Does NOT run on every commit. Triggered by:
#   - scheduled pipelines (nightly)
#   - manual button on any branch
#   - MRs that actually touch fetched data or the baseline
# ---------------------------------------------------------------------------
data-baseline-integration:
  stage: integration
  script:
    - uv sync --locked --group test
    - uv run pytest tests/integration/
        -m data_baseline
        --junitxml=integration.xml
        -v
  artifacts:
    when: always
    reports:
      junit: integration.xml
    paths:
      - integration.xml
    expire_in: 30 days
  timeout: 10 minutes
  rules:
    # Scheduled nightly runs always execute.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Explicit manual runs from the GitLab UI.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    # MRs that touch the committed data or baseline snapshot. Test
    # code and baseline.py changes are validated by the nightly
    # schedule — triggering on those in MRs would fail because
    # assets/bugdb.json (13 MB) is not committed to the repo.
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - assets/bugdb.json
        - tests/baselines/**/*

# ---------------------------------------------------------------------------
# Canary: probes real docs.paloaltonetworks.com URLs to detect when Palo
# Alto ships a new major version that the crawler's hard-coded candidate
# list doesn't know about. This is the only tier that catches the
# PAN-OS 12.1 class of bug.
#
# Lives in its OWN stage (not alongside data-baseline-integration) so a
# flaky upstream network probe can't block a green data-baseline run from
# deploying. Different failure modes deserve different blast radii.
#
# Scheduled nightly only — we don't want MRs blocked on upstream network
# availability.
# ---------------------------------------------------------------------------
upstream-canary:
  stage: canary
  script:
    - uv sync --locked --group test
    - uv run pytest tests/canary/
        -m canary
        --junitxml=canary.xml
        -v
  artifacts:
    when: always
    reports:
      junit: canary.xml
    expire_in: 30 days
  timeout: 5 minutes
  allow_failure: true  # Network flakes shouldn't page oncall at 3am.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------------------------------------------------------------------------
# Deploy: static site to GitLab Pages.
#
# Fires only when a commit lands on `main` via a push pipeline, which
# in practice means "after a merge request has been merged into main"
# (GitLab runs a push-source pipeline on the resulting merge commit).
# Explicitly branch-gated to "main" rather than $CI_DEFAULT_BRANCH so
# the behaviour doesn't silently change if the repo's default branch
# is ever switched. The CI_PIPELINE_SOURCE == "push" guard excludes
# schedule, web-manual, tag, and merge-request-event pipelines so they
# cannot accidentally trigger a deploy.
# ---------------------------------------------------------------------------
pages:
  stage: deploy
  script:
    - uv sync --locked
    # The deployed site loads bugdb.json at runtime from an external
    # CDN URL (see sed below), so we bake a minimal empty BugDatabase
    # just to satisfy build-site-cmd's file requirement. The
    # placeholder is deleted before artifacts are uploaded.
    - mkdir -p assets
    - |
      python -c "import json; json.dump({'metadata': {'generated_at': '1970-01-01T00:00:00Z', 'version': '1.0.0', 'source': 'GitLab Pages shell (placeholder; real data loaded from CDN at runtime)'}, 'products': []}, open('assets/bugdb.json', 'w'))"
    # Generate release-notes.json next to bugdb.json so build-site-cmd
    # auto-discovers it (see SiteBuilder.build_site in site_builder.py).
    - uv run bugdb generate-release-notes -o assets/release-notes.json --force
    - uv run bugdb build-site-cmd -b assets/bugdb.json -o public
    # Replace local bugdb.json path with external URL so the deployed
    # site loads real data from the CDN at runtime. If the CDN file is
    # renamed, update BOTH sides together (site deploy + CDN host).
    - sed -i "s|fetch('assets/bugdb.json')|fetch('https://repo.dependencyhell.net/bugdb/bugdb.json')|g" public/assets/app.js
    # Remove local bugdb.json since we're using external
    - rm -f public/assets/bugdb.json
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
